name: Python CI/CD Pipeline (Arch Linux Build)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: archlinux:latest
      
    steps:       
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'


    - name: Install Native Build Tools
      run: |
        pacman -Syyu --noconfirm
        pacman -S --noconfirm base-devel python python-setuptools python-build python-installer python-wheel ruff
        
        useradd --create-home --shell /bin/bash builder
    	chown -R builder:builder "$GITHUB_WORKSPACE"
        
    - name: Run Ruff Static Analysis
      run: ruff check src/unidesk/

    
    - name: Build Arch Packages 
      run: |

        mkdir -p output_package
        chown builder:builder output_package

        runuser -u builder -- makepkg --noconfirm
        mv ./*.pkg.tar.zst output_package/

    - name: Upload All Package Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: unidesk-complete-packages
        path: output_package/*

    - name: Publish . to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') # Only runs if you push a tag like v1.0.0
      with:
        files: output_package/*.pkg.tar.zst
